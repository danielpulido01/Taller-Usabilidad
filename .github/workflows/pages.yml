# Compila y publica app/v1 y app/v2 en GitHub Pages para las pruebas con usuarios en Maze.
# URL resultante: https://<usuario>.github.io/Taller-Usabilidad/v1/  y  .../v2/
# Opcional: crear la variable de repositorio MAZE_SNIPPET (Settings › Secrets and variables › Actions › Variables)
# con el código que entrega Maze; se inserta automáticamente en cada página.
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
    paths: ['app/**', 'vite.config.mjs', 'package-lock.json', 'scripts/preparar-pages.js', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/preparar-pages.js
        env:
          MAZE_SNIPPET: ${{ vars.MAZE_SNIPPET }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: despliegue
        uses: actions/deploy-pages@v4
